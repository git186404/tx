name: 部署 Next.js 到 GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 设置 GitHub Pages
        uses: actions/configure-pages@v5
        with:
          static_site_generator: next

      - name: 安装依赖
        run: npm ci

      - name: 构建项目
        run: npm run build
        env:
          # --- 这里是最重要的一行 ---
          # 这会让 next.config.ts 读取到 '/tx'
          NEXT_PUBLIC_BASE_PATH: /tx

      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
